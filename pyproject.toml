[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-composer"
version = "0.1.0"
description = "AIComposer — a tool for generating verified implementations from documentation and CVL specifications"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Certora Ltd."}
]

dependencies = [
    "graphcore @ git+ssh://git@github.com/Certora/graphcore.git@d427b0f5f039c84c9b170d184d35c352339ddcda",
    # >=3.14.4: GHSA-2g87-pp6c-29x5, GHSA-5wr8-gcqf-gqf3, GHSA-9xw5-w5jj-pvcg,
    # GHSA-cq5v-8q36-5273 and the other aiohttp advisories fixed in 3.14.0-3.14.4.
    "aiohttp>=3.14.4",
    "attrs>=26.1",
    "Jinja2>=3.1",
    "langgraph-checkpoint-postgres>=3.0",
    "numpy>=2.4",
    "prompt-toolkit>=3.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.12",
    "questionary>=2.1",
    "rich>=14.3",
    "textual>=8.1",
    "websockets",
    "chromadb>=0.4.0",
    "langgraph-prebuilt==1.0.8",
    # >=1.2.28: GHSA-926x-3r5x-gfhw. The <1.3.3 cap is deliberate and kept.
    "langchain_core>=1.2.28,<1.3.3",
    "certora-prover-cli",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=5.6.0", "einops"] # save CI; >=5.6.0: GHSA-jhr6-gm9c-rqjv

# Certora CLI package. certora-cli, certora-cli-beta, and
# certora-cli-beta-mirror are the same tool published under different package
# names — all install the `certora_cli` module, so they are MUTUALLY EXCLUSIVE;
# exactly one extra must be selected at install time (enforced via the
# [tool.uv] conflicts block below). Each extra is named after the package it
# pulls.
certora-cli = ["certora-cli>=8.16.1"]
certora-cli-beta = ["certora-cli-beta>=8.16.1"]
certora-cli-beta-mirror = ["certora-cli-beta-mirror>=8.16.1"]
# Back-compat alias: `prover` == stable channel.
prover = ["ai-composer[certora-cli]"]

[dependency-groups]
test = ["pytest>=9.0.3", "pytest-asyncio>=1.3", "testcontainers>=4.0"]
ci = ["pyright"]
ragbuild = [
    # duplicated! no way to prevent this, says only language where this nonsense is required
    "sentence-transformers>=5.6.0",  # GHSA-jhr6-gm9c-rqjv
    "einops",
    "spacy==3.8.7",
    "beautifulsoup4==4.13.5",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85",
    # foundry cheatcode mdx -> html conversion (composer.scripts.foundry_process)
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
]

[tool.uv]
conflicts = [
    [
        { extra = "certora-cli" },
        { extra = "certora-cli-beta" },
        { extra = "certora-cli-beta-mirror" },
    ],
]
# Security floors for transitive dependencies, each the lowest release that
# fixes the advisories named next to it. They only steer this project's lock.
constraint-dependencies = [
    "anyio>=4.14.2",              # GHSA-82r6-8w77-94w6, GHSA-5p39-cfhj-2xmp
    "cryptography>=50.0.0",       # GHSA-g6cj-pr64-35w5
    "fsspec>=2026.6.0",           # GHSA-27vj-qcqg-25rc
    "idna>=3.15",                 # GHSA-65pc-fj4g-8rjx
    "langgraph-sdk>=0.3.15",      # GHSA-w39p-vh2g-g8g5
    "langsmith>=0.8.18",          # GHSA-3644-q5cj-c5c7, GHSA-f4xh-w4cj-qxq8, GHSA-rr7j-v2q5-chgv
    "multidict>=6.9.1",           # GHSA-54p9-h82j-f925
    "oauthlib>=4.0.0",            # GHSA-hj66-6f7g-4r5v, GHSA-xpv3-w29h-x7cv
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j
    "setuptools>=83.0.0",         # GHSA-h35f-9h28-mq5c
    "soupsieve>=2.9.0",           # GHSA-2wc2-fm75-p42x, GHSA-836r-79rf-4m37, GHSA-gjv8-xp57-g29c, GHSA-j934-xhv5-fg8f
    "torch>=2.13.0",              # GHSA-rrmf-rvhw-rf47
    "transformers>=5.10.1",       # GHSA-fgcw-684q-jj6r, GHSA-x9r9-c232-4q39, GHSA-xrqw-3rrv-vx5w (5.10.0 is yanked)
    "urllib3>=2.8.0",             # GHSA-8988-9cw3-xx77, GHSA-gh4c-6fx4-qh6g, GHSA-mf9v-mfxr-j63j, GHSA-qccp-gfcp-xxvc, GHSA-vxq7-64xx-v4gw
    # urllib3-future (via certora-cloud -> niquests) installs a .pth hook that
    # replaces site-packages/urllib3 with its own copy at interpreter startup, so
    # its code is what `import urllib3` runs. 2.25.900 backports the fixes for
    # GHSA-8988-9cw3-xx77 and GHSA-gh4c-6fx4-qh6g.
    "urllib3-future>=2.25.900",
]

[tool.uv.sources]
graphcore = { path = "./graphcore", editable = true }

[project.scripts]
cex-analyzer = "analyzer.analysis:main"
ap-trail = "composer.cli.ap_trail:main"
console-foundry = "composer.cli.console_foundry:main"
tui-foundry = "composer.cli.tui_foundry:main"
autoprove-report-render = "composer.spec.source.report.render:main"
tui-natspec = "composer.cli.tui_pipeline:main"
cache-natspec = "composer.cli.cache_natspec:main"

[tool.setuptools.packages.find]
include = ["composer*", "sanity_analyzer*", "analyzer*"]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.package-data]
composer = ["templates/*.j2", "scripts/init-db.sql"]
